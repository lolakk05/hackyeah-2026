# nginx for the Spacer.io web app (Expo static export).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Bundles have a content hash in the name: cache them for a long time.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Place pages: /place/<any id> → the page made for the /place/[id] route.
  location ~ ^/place/[^/]+/?$ {
    try_files $uri "/place/[id].html";
  }

  # Every screen has its own .html (/map → map.html); unknown paths → start screen.
  location / {
    try_files $uri $uri.html $uri/index.html /index.html;
  }
}
