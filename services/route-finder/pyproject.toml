[project]
name = "route-finder"
version = "0.2.0"
description = "Time-budget walking itineraries between Krakow POIs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "scipy>=1.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "hardcoded-zgloszenie/tests"]
pythonpath = [".", "hardcoded-zgloszenie"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
